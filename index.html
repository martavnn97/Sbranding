<style id="hub-style">
/* Layout: testata con wordmark e tab, colonna unica da 1120px, schede sobrie su base bianca, fucsia usato solo per accenti */
:root{
  --bg:#FFFFFF; --surface:#FCF1F7; --surface-2:#F8D3E5; --peach:#FFDFCB;
  --fg:#0A0A0A; --fg-2:#2B2B2B; --muted:#6E5F67; --line:#E3E3E3;
  --accent:#A50F5E; --accent-deep:#8D0B50; --accent-ink:#FFFFFF;
  --ok:#2F7A4F; --warn:#9A5B00; --hyp:#6A4C93;
  --ch-li:#2D5F9A; --ch-ss:#B5541F;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#140B10; --surface:#1F1219; --surface-2:#3A1D2C; --peach:#3B2620;
  --fg:#F6EEF2; --fg-2:#E2D3DA; --muted:#B9A6B0; --line:#3A2A33;
  --accent:#E0559C; --accent-deep:#F27AB6; --accent-ink:#140B10;
  --ok:#6CC08F; --warn:#E3A84B; --hyp:#B79BE0; --ch-li:#86B4EC; --ch-ss:#F0A070; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#140B10; --surface:#1F1219; --surface-2:#3A1D2C; --peach:#3B2620;
  --fg:#F6EEF2; --fg-2:#E2D3DA; --muted:#B9A6B0; --line:#3A2A33;
  --accent:#E0559C; --accent-deep:#F27AB6; --accent-ink:#140B10;
  --ok:#6CC08F; --warn:#E3A84B; --hyp:#B79BE0; --ch-li:#86B4EC; --ch-ss:#F0A070; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 80px}
h1,h2,h3{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
h1 em,h2 em,h3 em{font-style:italic;color:var(--accent)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* testata */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px))}
.top-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px 0}
.mark{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:700;letter-spacing:.14em;font-size:15px}
.mark small{display:block;font-family:var(--body);font-weight:500;letter-spacing:.02em;font-size:11px;color:var(--accent);font-style:italic}
.savebox{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface);color:var(--fg-2);white-space:nowrap}
.pill.dirty{background:var(--peach)}
.pill.ok{color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-deep);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.danger:hover{border-color:#C0392B;color:#C0392B}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{flex-basis:100%;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 12px 12px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
.tabs a span{font-family:var(--display);font-style:italic;color:var(--accent);margin-right:4px;font-weight:500}

/* sezioni */
.view{display:grid;gap:36px;padding-top:28px}
.sec{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.sec-head p{margin:4px 0 0;max-width:70ch}
.lead{font-size:17px;max-width:68ch;margin:8px 0 0;color:var(--fg-2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;background:var(--bg);min-width:0}
.card.soft{background:var(--surface);border-color:transparent}
.principle{background:var(--surface);border-radius:var(--r);padding:20px;display:grid;gap:6px}
.principle p{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:20px;line-height:1.35}
.principle p em{color:var(--accent)}

/* campi modificabili */
.f{display:grid;gap:3px;min-width:0}
.f > span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.in, .ta, .sel{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin-inline:-6px;width:calc(100% + 12px);min-width:0}
.in:hover,.ta:hover,.sel:hover{border-color:var(--line)}
.in:focus,.ta:focus,.sel:focus{border-color:var(--accent);background:var(--bg);outline:none}
.ta{resize:vertical;min-height:2.2em;field-sizing:content;line-height:1.45}
.in.big{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:18px;font-weight:500}
.why{border-left:2px solid var(--surface-2);padding-left:10px}
.why .ta{font-size:13.5px;color:var(--fg-2)}
.why > span::before{content:"perché  ";color:var(--accent);font-style:italic;text-transform:none;letter-spacing:0;font-family:var(--display);font-size:13px}
.row-actions{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface);color:var(--fg-2);white-space:nowrap}
.tag.proposta{background:var(--peach)}
.tag.ver{color:var(--ok);background:transparent;border:1px solid currentColor}
.tag.hyp{color:var(--hyp);background:transparent;border:1px dashed currentColor}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* tabelle */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
td{padding:6px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .in,td .ta{margin:0;width:100%}
.num{font-variant-numeric:tabular-nums;text-align:right}

/* rubriche */
.rub{border-top:4px solid var(--c, var(--accent))}
.rub-head{display:flex;align-items:center;gap:10px}
.rub-head input[type=color]{width:28px;height:28px;border:1px solid var(--line);border-radius:50%;padding:0;background:none;cursor:pointer;flex:none}
.rub-head input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.rub-head input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mix{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface)}
.mix span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* calendario */
.cal-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav h2{min-width:9ch;text-align:center;font-size:22px}
.monthnav h2 em{font-style:italic}
.note-month{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.note-month .ta{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:17px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r);padding:12px 14px;background:var(--bg);text-align:left;color:var(--fg);width:100%}
.item:hover{border-color:var(--c)}
.item .d{font-family:var(--display);font-variation-settings:"SOFT" 100;line-height:1}
.item .d b{display:block;font-size:26px;font-weight:500}
.item .d i{font-size:12px;color:var(--muted);font-style:normal;text-transform:capitalize}
.item .t{min-width:0}
.item .t strong{display:block;font-weight:600;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted)}
.status{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;white-space:nowrap}
.st-Idea{background:var(--surface);color:var(--muted)}
.st-Da-preparare{background:var(--peach);color:var(--warn)}
.st-In-lavorazione{background:var(--surface-2);color:var(--accent)}
.st-Pronto{background:var(--accent);color:var(--accent-ink)}
.st-Pubblicato{background:transparent;color:var(--ok);border:1px solid currentColor}
.calgrid-wrap{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:900px;border-radius:var(--r);overflow:hidden}
.calgrid .wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface)}
.day{min-height:120px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--bg);text-align:left;color:var(--fg);font:inherit;border-top:0;border-left:0;cursor:pointer}
.day:hover{background:var(--surface)}
.day.out{background:var(--surface);opacity:.45}
.day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.day .n{font-size:12px;font-weight:600;align-self:flex-start;font-variant-numeric:tabular-nums}
.chip{display:grid;gap:4px;width:100%;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 7px;font:inherit;font-size:12.5px;line-height:1.3;cursor:pointer}
.chip .ct{font-weight:600;overflow-wrap:anywhere;text-wrap:pretty}
.chip .cm{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip .rb{font-size:10.5px;font-weight:700;letter-spacing:.02em;color:var(--c);text-transform:uppercase}
.chip .fm{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;background:var(--surface);color:var(--fg-2)}
.chip.pub{background:var(--surface)}
.chip .st{width:7px;height:7px;border-radius:50%;margin-left:auto;flex:none}
.day.we{background:color-mix(in srgb, var(--surface) 45%, var(--bg))}
.chip:hover{background:var(--surface-2)}

/* modale */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(20px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:14px;align-content:start;border-left:4px solid var(--c, var(--accent))}
.drawer .in,.drawer .ta,.drawer .sel{border-color:var(--line);margin:0;width:100%}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.metrics .in{text-align:right;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--peach);padding:10px;border-radius:8px}

/* dashboard */
.banner{border:1px dashed var(--accent);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface)}
.banner.example{border-style:solid;background:var(--peach)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.tile small{color:var(--muted);font-size:12px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,170px) 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;border-radius:999px;background:var(--surface);overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pv{display:grid;grid-template-columns:minmax(110px,170px) 1fr 70px;gap:10px;align-items:center;font-size:13px}
.pv .track{position:relative;height:12px;border-radius:999px;background:var(--surface)}
.pv .fill{position:absolute;inset:0 auto 0 0;border-radius:999px}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}

/* inspo */
.insight{display:grid;gap:4px}
.insight b{font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:20px;font-weight:500}
.hookq{font-family:var(--display);font-style:italic;font-variation-settings:"SOFT" 100;font-size:17px;color:var(--fg)}
.trend-top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.src{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.capture{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.capture textarea{font:inherit;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:18px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:3.2em;resize:vertical}
.capture textarea:focus{border-color:var(--accent);outline:none}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--bg);color:var(--fg-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.idea{border-left:4px solid var(--c, var(--line))}
.ist{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;white-space:nowrap}
.ist-Da-registrare{background:var(--peach);color:var(--warn)}
.ist-Da-editare{background:var(--surface-2);color:var(--accent)}
.ist-Editato{background:transparent;color:var(--ok);border:1px solid currentColor}
.ist-Programmato{background:var(--accent);color:var(--accent-ink)}
.ott{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.alts{display:flex;flex-direction:column;gap:6px}
.alts button{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font-family:var(--display);font-style:italic;font-variation-settings:"SOFT" 100;font-size:15px}
.alts button:hover{border-color:var(--accent)}
.qs{margin:0;padding-left:18px;color:var(--fg-2);font-size:14px}
.propbox{background:var(--surface);border-radius:8px;padding:14px;display:grid;gap:10px}
.capprop{white-space:pre-wrap;font-size:14px;line-height:1.5;color:var(--fg-2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.chs{display:inline-flex;gap:4px;flex-wrap:wrap}
.chb{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--bg);color:var(--muted)}
.chb[aria-pressed="true"]{color:var(--accent-ink);border-color:transparent}
.chb.ig[aria-pressed="true"]{background:var(--accent)}
.chb.li[aria-pressed="true"]{background:var(--ch-li)}
.chb.ss[aria-pressed="true"]{background:var(--ch-ss)}
.chbadge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;color:var(--accent-ink)}
.chbadge.ig{background:var(--accent)}.chbadge.li{background:var(--ch-li)}.chbadge.ss{background:var(--ch-ss)}
.chan{border-top:4px solid var(--cc)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-radius:var(--r);overflow:hidden}
.flow > div{padding:14px 16px;display:grid;gap:4px;color:var(--accent-ink)}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.nota{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;padding:12px 16px;display:grid;gap:4px}
.nota p{margin:0;font-family:var(--display);font-variation-settings:"SOFT" 100;font-size:16.5px;line-height:1.45;max-width:80ch}
.nota small{font-size:11.5px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:30}
@media (max-width:640px){
  .two{grid-template-columns:1fr}
  .item{grid-template-columns:48px 1fr}
  .item .status{grid-column:2;justify-self:start}
  .bar,.pv{grid-template-columns:1fr 54px}
  .bar .lbl,.pv .lbl{grid-column:1 / -1}
}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.day,.item{transition:background-color .15s,border-color .15s,color .15s}}
</style>

function spark(rows){var W=640,H=140,pl=46,pr=16,pt=14,pb=26;var v=rows.map(function(r){return +r.follower});var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);if(mx===mn){mx+=1;mn-=1}

  return '<h3 style="margin-bottom:6px">Follower</h3><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Andamento follower"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(mx)+4)+'" text-anchor="end">'+fmtN(mx)+'</text><text x="'+(pl-6)+'" y="'+(y(mn)+4)+'" text-anchor="end">'+fmtN(mn)+'</text><path d="'+area+'" fill="var(--surface-2)" opacity=".6"/><path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+v.map(function(n,i){return '<circle cx="'+x(i)+'" cy="'+y(n)+'" r="'+(i===v.length-1?4:2.5)+'" fill="var(--accent)"/><text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(String(rows[i].mese))+'</text>'}).join('')+'</svg>'}

    case 'post-hook':var ph=state.calendario.post.find(function(x){return x.id===id});if(ph&&ph.prop){var jh=+el.getAttribute('data-j'),oh=ph.hook;ph.hook=ph.prop.hooks[jh];if(oh)ph.prop.hooks[jh]=oh;else ph.prop.hooks.splice(jh,1)}break;
    case 'post-cap':var pc=state.calendario.post.find(function(x){return x.id===id});if(pc&&pc.prop){var oc=pc.caption;pc.caption=pc.prop.caption;pc.prop.caption=oc||''}break;
    case 'use-hook':var xi=state.inspo.mieIdee[i];if(xi&&xi.ott){var j=+el.getAttribute('data-j'),old=xi.hook;xi.hook=xi.ott.hooks[j];if(old)xi.ott.hooks[j]=old;else xi.ott.hooks.splice(j,1)}break;
    case 'idea-to-cal':var xc=state.inspo.mieIdee[i];var smap={'Da registrare':'Da preparare','Da editare':'In lavorazione','Editato':'Pronto','Programmato':'Pronto'};var pid=uid('c');
      var nt=[xc.note,xc.ott&&xc.ott.angolo?'Angolo: '+xc.ott.angolo:'',xc.ott&&xc.ott.struttura?'Scaletta:\n'+xc.ott.struttura:'',xc.ott&&xc.ott.cta?'CTA: '+xc.ott.cta:''].filter(Boolean).join('\n\n');
      xc.postId=pid;newPost(xc.data||nextSlot(),{id:pid,titolo:xc.ott&&xc.ott.titolo?xc.ott.titolo:xc.testo,rubrica:xc.rubrica||(state.ped.rubriche[0]||{}).id,formato:xc.formato||'Carosello',hook:xc.hook||'',status:smap[xc.status]||'Idea',note:nt,canali:Object.assign({},xc.canali||{}),canaliPerche:xc.canaliPerche||''});location.hash='calendario';return;
    case 'prop-cal':var pr=el.getAttribute('data-k')==='saved'?state.inspo.proposte[i]:ruleProposals(postsWithData())[i];if(pr){newPost(nextSlot(),{titolo:pr.titolo,rubrica:pr.rubrica,formato:FORMATI.indexOf(pr.formato)>-1?pr.formato:'Carosello',hook:pr.hook&&pr.hook.indexOf('Riprendi')!==0?pr.hook:'',note:pr.perche||''});ui.tab='calendario';location.hash='calendario'}return;
    default:return;
  }
  markDirty();render();
});

/* ---------- CLAUDE (sample) ---------- */
function askClaude(){if(!sampleApi||ui.sampleBusy)return;var rows=postsWithData();ui.sampleBusy=true;ui.sampleErr='';render();
  var data={rubriche:state.ped.rubriche.map(function(r){return {id:r.id,nome:r.nome,descrizione:r.descrizione,stato:r.stato}}),
    perRubrica:groupBy(rows,function(x){return x.p.rubrica}).map(function(g){return {rubrica:rub(g.k).nome,id:g.k,post:g.n,salvCond:+g.val.toFixed(4),interazione:+g.er.toFixed(4)}}),
    perFormato:groupBy(rows,function(x){return x.p.formato}).map(function(g){return {formato:g.k,post:g.n,interazione:+g.er.toFixed(4)}}),
    hookMigliori:rows.slice().sort(function(a,b){return b.val-a.val}).slice(0,5).map(function(x){return {hook:x.p.hook||x.p.titolo,rubrica:rub(x.p.rubrica).nome,formato:x.p.formato}}),
    ideeInCantiere:state.ped.idee.map(function(d){return d.testo}),posizionamento:state.strategia.posizionamento.testo,datiDiEsempio:ui.example};
  var prompt='Sei una social media strategist senior italiana. Profilo Instagram @sbranding_ di Marta Vannelli: brand strategy, social, AI come acceleratore creativo con direzione autoriale. Pubblico: imprenditori con un business avviato e persone che lavorano con i social. Dati delle performance (JSON):\n'+JSON.stringify(data)+'\n\nProponi 4 nuovi contenuti Instagram che riprendono la logica di rubriche, formati e hook che hanno funzionato meglio. Scrivi in italiano naturale, senza trattini lunghi, senza frasi fatte. Rispondi SOLO con un array JSON di 4 oggetti con chiavi: titolo, rubrica (usa l\'id della rubrica, es. r1), formato (Reel o Carosello o Post singolo o Stories), hook (la prima frase), perche (una frase che collega la proposta ai dati).';
  sampleApi.json(prompt,{modelTier:'default'}).then(function(arr){if(!Array.isArray(arr))throw {message:'Risposta non valida'};
    arr.slice(0,4).forEach(function(p){if(p&&p.titolo)state.inspo.proposte.push({titolo:String(p.titolo),rubrica:state.ped.rubriche.some(function(r){return r.id===p.rubrica})?p.rubrica:'r2',formato:String(p.formato||''),hook:String(p.hook||''),perche:String(p.perche||''),origine:'claude'})});
    ui.sampleBusy=false;markDirty();render();toast('Nuove proposte aggiunte: ricordati di salvare')})
  .catch(function(err){ui.sampleBusy=false;ui.sampleErr=err&&err.code==='rate_limited'?'Troppe richieste ravvicinate, riprova tra qualche minuto.':err&&err.code==='not_granted'?'Permesso non concesso: le proposte automatiche restano disponibili qui sopra.':'Non sono riuscita a generare le proposte, riprova più tardi.';if(err&&err.code==='not_granted')sampleApi=null;render()})}

/* ---------- SALVATAGGIO ---------- */
function buildDoc(s){var css=document.getElementById('hub-style').textContent,js=document.getElementById('hub-app').textContent;
  var json=JSON.stringify(s,null,1).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
  '<title>Hub Sbranding</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+'\n<style id="hub-style">'+css+'</style>\n\n<div id="app"><div class="wrap"><p class="muted">Carico il piano editoriale…</p></div></div>\n\n<script type="application/json" id="hub-state">\n'+json+'\n<\/script>\n\n<script id="hub-app">'+js+'<\/script></body></html>'}
function save(){if(!artifactApi||saving||!dirty)return;saving=true;renderSaveBox();
  var s=JSON.parse(JSON.stringify(state));s.meta.savedAt=new Date().toISOString();s.meta.savedBy=HUB.name;
  HUB.save(s).then(function(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}baseState=s;state=JSON.parse(JSON.stringify(s));dirty=false;saving=false;ui.remote=null;render();toast('Salvato: ora lo vede anche chi lavora con te')})
  .catch(function(err){saving=false;
    if(err&&err.code==='conflict'){ui.remote=err.info;renderSaveBox();toast('Nel frattempo '+(err.info.savedBy||'qualcuno')+' ha salvato una versione nuova')}
    else if(err&&err.code==='chiave'){toast('Chiave non più valida: ricarica la pagina')}
    else{renderSaveBox();toast('Salvataggio non riuscito, le modifiche restano in questa pagina. Riprova tra poco')}})}

function pullRemote(msg){return HUB.load().then(function(d){HUB.v=d.version;baseState=d.state;state=JSON.parse(JSON.stringify(d.state));dirty=false;ui.remote=null;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}safeRender();renderSaveBox();if(msg)toast(msg)})}
function dl(name,content,type){var b=new Blob([content],{type:type});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}

/* ---------- AVVIO ---------- */
function route(){var h=location.hash.replace('#','');ui.tab=TABS.some(function(t){return t[0]===h})?h:'strategia';if(ui.tab!=='calendario')ui.open=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});
route();
artifactApi={};
(function(){var raw=window.__hubIG||{media:[],months:{},prof:null,stats:null};var st=raw.stats||{},sm=st.media||{};
  live.media=(raw.media||[]).map(function(x){return Object.assign({},x,sm[x.id]||{})}).sort(function(a,b){return String(b.timestamp||b.data).localeCompare(String(a.timestamp||a.data))});
  live.months=Object.assign({},raw.months||{},st.months||{});
  live.prof=st.profilo||raw.prof;live.commenti=st.commenti||null;live.commentiAt=st.commentiAt||st.aggiornato||null;})();
render();
setInterval(function(){if(document.hidden||saving)return;HUB.version().then(function(v){if(!v||v.version===HUB.v)return;
  if(!dirty&&!ui.open){pullRemote((v.savedBy||'Qualcuno')+' ha aggiornato il piano')}else{ui.remote=v;renderSaveBox()}}).catch(function(){})},40000);
};
</script>
<script id="hub-loader">(function(){
"use strict";
var LS='sbranding-hub-conn';
var DEFAULT_URL='';
var conn={};try{conn=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
if(!conn.url&&DEFAULT_URL)conn.url=DEFAULT_URL;
function q(o){return Object.keys(o).map(function(k){return k+'='+encodeURIComponent(o[k])}).join('&')}
function get(p){return fetch(conn.url+(conn.url.indexOf('?')>-1?'&':'?')+q(p)).then(function(r){return r.json()})}
function post(b){return fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
window.HUB={v:0,name:'',
  load:function(){return get({action:'load',key:conn.key}).then(function(d){if(!d.ok)throw {code:d.error};if(d.empty)throw {code:'vuoto'};return d})},
  version:function(){return get({action:'version',key:conn.key}).then(function(d){return d.ok&&!d.empty?d:null})},
  save:function(s){return post({action:'save',key:conn.key,by:conn.name,baseVersion:HUB.v,state:s}).then(function(d){if(!d.ok)throw (d.conflict?{code:'conflict',info:d}:{code:d.error||'errore'});HUB.v=d.version;return d})}};
var app=document.getElementById('app');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var box='max-width:440px;margin:12vh auto 0;display:grid;gap:14px;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)';
var fld='font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%';
function form(msg){
  app.innerHTML='<form id="hub-login" style="'+box+'"><div class="mark">SBRANDING<small>hub editoriale condiviso</small></div>'+
  '<p class="muted small" style="margin:0">Inserisci il collegamento e la chiave che ti ha mandato Marta. Li ricordo su questo browser.</p>'+
  (msg?'<p class="small" style="margin:0;color:var(--accent)">'+esc(msg)+'</p>':'')+
  '<label class="f"><span>Il tuo nome</span><input style="'+fld+'" name="name" required value="'+esc(conn.name||'')+'" placeholder="Come ti firmi quando salvi"></label>'+
  (DEFAULT_URL?'':'<label class="f"><span>Collegamento</span><input style="'+fld+'" name="url" required value="'+esc(conn.url||'')+'" placeholder="https://script.google.com/macros/s/…/exec"></label>')+
  '<label class="f"><span>Chiave</span><input style="'+fld+'" name="key" type="password" required value="'+esc(conn.key||'')+'"></label>'+
  '<button class="btn primary" style="justify-self:start">Entra</button></form>';
  document.getElementById('hub-login').onsubmit=function(e){e.preventDefault();var f=e.target;
    conn={name:f.name.value.trim(),url:(f.url?f.url.value.trim():DEFAULT_URL),key:f.key.value.trim()};
    try{localStorage.setItem(LS,JSON.stringify(conn))}catch(x){}start()}}
function initForm(){
  app.innerHTML='<div style="'+box+'"><div class="mark">SBRANDING<small>primo avvio</small></div>'+
  '<p style="margin:0">Il collegamento funziona ma l’archivio è vuoto. Carica il file <b>hub-sbranding-dati.json</b> per partire con il piano attuale.</p>'+
  '<input type="file" id="hub-init" accept=".json,application/json"><p class="small muted" id="hub-init-msg" style="margin:0"></p></div>';
  document.getElementById('hub-init').onchange=function(e){var file=e.target.files[0];if(!file)return;var m=document.getElementById('hub-init-msg');m.textContent='Carico…';
    file.text().then(function(t){var o=JSON.parse(t);var st=o.state||o;if(!st.strategia)throw 0;return post({action:'init',key:conn.key,by:conn.name,state:st,ig:o.ig||null})})
    .then(function(d){if(!d.ok)throw d;start()}).catch(function(){m.textContent='File non valido o archivio già inizializzato.'})}}
function boot(d){HUB.v=d.version;HUB.name=conn.name;window.__hubIG=d.ig||null;
  document.getElementById('hub-state').textContent=JSON.stringify(d.state);window.__bootHub()}
function start(){
  if(!conn.url||!conn.key||!conn.name)return form('');
  app.innerHTML='<div class="wrap"><p class="muted">Apro l’hub…</p></div>';
  HUB.load().then(boot).catch(function(err){var c=err&&err.code;
    if(c==='vuoto')return initForm();
    form(c==='chiave'?'La chiave non è corretta.':'Non riesco a raggiungere il collegamento. Controlla che sia giusto e riprova.')})}
start();
})();
</script>
